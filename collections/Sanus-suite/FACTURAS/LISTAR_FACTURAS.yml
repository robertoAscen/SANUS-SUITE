info:
  name: LISTAR_FACTURAS
  type: http
  seq: 1

http:
  method: get
  url: "{{HOST}}{{SANUS_SUITE}}/facturas{{API}}{{V1}}/listar"
  headers:
    - name: x-tenant-id
      value: CLINICA-GDI-01
    - name: x-usuario-id
      value: "1"
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{JWT_TOKEN}}"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
